<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Video Image Material Test</title>
  <script src="vendor/cesium/Cesium.js"></script><script src="dist/jsmpeg.min.js"></script>
  <link href="vendor/cesium/Widgets/widgets.css" rel="stylesheet"><link href="css/main.css" rel="stylesheet">
</head>
<body>
  <div id="cesiumContainer"></div><canvas id="video-canvas"></canvas>
  <div id="tools">Experimental: live video on a 3D surface. <a href="/">Back to viewer</a></div>
  <script>
    const canvas=document.getElementById('video-canvas');
    const url=new URLSearchParams(location.search).get('stream') || `${location.protocol==='https:'?'wss:':'ws:'}//${location.hostname}:8082/`;
    const player=new JSMpeg.Player(url,{audio:false,data:false,canvas,disableGl:true});
    const viewer=new Cesium.Viewer('cesiumContainer',{baseLayer:false,baseLayerPicker:false,geocoder:false,timeline:false,animation:false});
    const surface=viewer.entities.add({position:Cesium.Cartesian3.fromDegrees(-80.53,43.50,300),box:{dimensions:new Cesium.Cartesian3(640,1,360),
      material:new Cesium.ImageMaterialProperty({image:new Cesium.CallbackProperty(()=>canvas,false)})}});
    viewer.zoomTo(surface,new Cesium.HeadingPitchRange(0,-0.2,1500));
    window.addEventListener('pagehide',()=>{player.destroy();viewer.destroy();},{once:true});
  </script>
</body>
</html>
