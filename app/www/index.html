<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Cesium Telemetry Demo</title>
  <script src="vendor/cesium/Cesium.js" defer></script>
  <script src="dist/jsmpeg.min.js" defer></script>
  <script src="dist/main.min.js" defer></script>
  <link href="vendor/cesium/Widgets/widgets.css" rel="stylesheet">
  <link href="css/main.css" rel="stylesheet">
</head>
<body>
  <div id="tools">
    <label>Camera <select id="camera-mode"><option value="free">Free</option><option value="fpv">FPV</option><option value="follow">Follow</option></select></label>
    <label>Map <select id="map-layer"><option value="local">Offline globe</option><option value="osm">OpenStreetMap</option><option value="satellite">Satellite</option><option value="street">ArcGIS Street</option></select></label>
    <label><input id="weather" type="checkbox"> Weather</label>
    <label title="Set terrainUrl in the page URL to use your terrain service"><input id="terrain" type="checkbox" disabled> Terrain</label>
    <label><input id="grid" type="checkbox"> Grid</label>
    <label><input id="show-video" type="checkbox" checked> Video</label>
    <label><input id="centre-video" type="checkbox"> Center video</label>
    <button id="focus-flyer" disabled>Focus flyer</button>
    <a href="view-stream.html">Raw telemetry</a>
  </div>
  <div id="cesiumContainer"></div>
  <canvas id="video-canvas" aria-label="Live UAV video"></canvas>
  <pre id="telemetry">Waiting for telemetry…</pre>
  <div id="status" role="status">Connecting to stream…</div>
  <pre id="klv-output" hidden></pre>
</body>
</html>
